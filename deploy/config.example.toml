# LP-100A Server configuration. Install at /etc/lp100a-server/config.toml.

[serial]
# Path to the LP-100A serial device.
#   Linux:   /dev/ttyUSB0  (or /dev/ttyUSB_LPM with the udev rule below)
#   Windows: COM3
#   macOS:   /dev/cu.usbserial-XXXX
# Use "auto" to scan for the first USB-serial adapter (or the udev symlink).
port             = "/dev/ttyUSB_LPM"
baud             = 115200
poll_interval_ms = 100   # 50–250 ms; matches the LP-100-VCP pollrate range

[server]
# IMPORTANT: this server has NO authentication. Bind it to a LAN interface
# only; anyone who can reach it can issue control commands. For untrusted
# networks, front it with a VPN (Tailscale, WireGuard) or set
# allow_control = false to expose a read-only port.
listen        = "0.0.0.0:8088"
heartbeat_ms  = 2000
max_clients   = 32
allow_control = true

[ui]
# Which web display modes are available via the VIEW pill on the web client.
# This is INDEPENDENT of the meter's mode — the Mode button on the web only
# cycles the LP-100A's LCD, it does not change the web view.
#
#   "normal"          — power + SWR bargraphs (always enabled on the meter)
#   "vector"          — |Z|, phase, R, X with polar compass (always enabled)
#   "dbm"             — dBm + Return Loss + mismatch loss
#   "field_strength"  — dBm via Direct Input on the rear panel
#   "peak_avg"        — Peak / Avg / ratio derived client-side over 2 s window
#
# Default enables all five web views; trim the list to limit what the VIEW
# pill cycles through.
enabled_views = ["normal", "vector", "dbm", "field_strength", "peak_avg"]
